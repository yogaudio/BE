name = "yogaudio-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Non-secret vars. Local dev points the upstreams at the fake server (dev/fake-upstreams.mjs).
# Production values (real API bases, https://www.yogaudio.com, collection id) are set at deploy time; see README.
[vars]
LOGIN_PAGE_ORIGIN = "http://localhost:8788"
ACTIVE_PLAN_STATUSES = "ACTIVE,TRIALING,PAST_DUE"
ALLOWED_PLAN_IDS = ""
MEMBERSTACK_API_BASE = "http://localhost:8788/memberstack"
WEBFLOW_API_BASE = "http://localhost:8788/webflow"
TRANSISTOR_API_BASE = "http://localhost:8788/transistor"
WEBFLOW_COLLECTION_ID = "fake-collection"

# Local ids only; replace with real ones from `wrangler d1 create` / `wrangler kv namespace create` before deploy.
[[d1_databases]]
binding = "DB"
database_name = "yogaudio-api"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"
