name = "yogaudio-api-dev"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Non-secret vars. Local dev points the upstreams at the fake server (dev/fake-upstreams.mjs).
# Production values live in [env.production] below.
[vars]
LOGIN_PAGE_ORIGIN = "http://localhost:8788"
ACTIVE_PLAN_STATUSES = "ACTIVE,TRIALING"
ALLOWED_PLAN_IDS = ""
MEMBERSTACK_API_BASE = "http://localhost:8788/memberstack"
WEBFLOW_API_BASE = "http://localhost:8788/webflow"
STRIPE_API_BASE = "http://localhost:8788/stripe"
WEBFLOW_COLLECTION_ID = "fake-collection"
WF_STYLES_COLLECTION_ID = "fake-styles"
WF_FOCUS_COLLECTION_ID = "fake-focus"
WF_DURATIONS_COLLECTION_ID = "fake-durations"

# Local dev only (top level). Production deploys use `wrangler deploy --env production`.
# Local ids only; the production ones are in [env.production] below.
[[d1_databases]]
binding = "DB"
database_name = "yogaudio-api"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

# Rate limit for POST /auth/code (10 per 60s per IP). Not inherited by environments; repeated below.
[[ratelimits]]
name = "AUTH_CODE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Production. Bindings and vars are NOT inherited from the top level, so everything is repeated here.
[env.production]
name = "yogaudio-api"
account_id = "a41e300f18db46bed221c07814d67f3d"
workers_dev = true
preview_urls = false

[env.production.vars]
LOGIN_PAGE_ORIGIN = "https://www.yogaudio.com"
ACTIVE_PLAN_STATUSES = "ACTIVE,TRIALING"
ALLOWED_PLAN_IDS = ""
MEMBERSTACK_API_BASE = "https://admin.memberstack.com"
WEBFLOW_API_BASE = "https://api.webflow.com"
STRIPE_API_BASE = "https://api.stripe.com"
# STRIPE_RESTRICTED_KEY is a secret: wrangler secret put STRIPE_RESTRICTED_KEY --env production
WEBFLOW_COLLECTION_ID = "69dfa08c6df4c012c08ab369"
WF_STYLES_COLLECTION_ID = "69df9f2f93abe92e0f48c006"
WF_FOCUS_COLLECTION_ID = "69df9f94ea2119ca1015c06f"
WF_DURATIONS_COLLECTION_ID = "6a1da5cffb3303724f335c63"

[[env.production.d1_databases]]
binding = "DB"
database_name = "yogaudio-api"
database_id = "3cd9351e-f250-45c8-a25f-aef286ec0ca5"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "8744f2d9203343b49a7049a32d9b0960"

[[env.production.ratelimits]]
name = "AUTH_CODE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
